
    <div class="container-fluid">
      <div class="card border-0 shadow-sm p-5 text-center">
        <div class="mb-4">
          <i [class]="'bi ' + icon + ' display-1 text-primary bg-light p-4 rounded-circle'"></i>
        </div>
        <h2 class="fw-bold">{{ title }}</h2>
        <p class="text-muted fs-5 mx-auto" style="max-width: 600px;">
          The {{ title }} module is currently being initialized. This section will handle core operations for 
          <strong>Garments ERP</strong> including data management, reporting, and workflow automation.
        </p>
        <div class="mt-4">
          <button class="btn btn-primary px-4 py-2">
            <i class="bi bi-plus-lg me-2"></i> Configure Module
          </button>
        </div>
      </div>
    </div>
