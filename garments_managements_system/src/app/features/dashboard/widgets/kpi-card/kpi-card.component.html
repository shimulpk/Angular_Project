
    <div class="card bg-white p-3 border-0 shadow-sm h-100">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <p class="text-muted mb-1">{{ label }}</p>
          <h2 class="mb-0 fw-bold">{{ value }}</h2>
        </div>
        <div [class]="'p-3 bg-' + color + ' bg-opacity-10 text-' + color + ' rounded-3'">
          <i [class]="'bi ' + icon + ' fs-4'"></i>
        </div>
      </div>
      <div class="mt-3 small" [class.text-success]="trendValue > 0" [class.text-danger]="trendValue < 0" [class.text-info]="trendValue === 0">
        <i [class]="trendValue > 0 ? 'bi bi-arrow-up' : (trendValue < 0 ? 'bi bi-arrow-down' : 'bi bi-dash')"></i> 
        {{ trendText }}
      </div>
    </div>
