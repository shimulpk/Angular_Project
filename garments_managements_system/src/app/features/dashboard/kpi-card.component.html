<div class="card h-100 kpi-card" [ngClass]="'border-start border-4 border-' + color">
  <div class="card-body p-4 d-flex align-items-center">
    <div class="flex-grow-1">
      <h6 class="text-muted small text-uppercase fw-bold mb-1">{{ title }}</h6>
      <h3 class="fw-bold mb-0">{{ value }}</h3>
    </div>
    <div class="icon-box bg-{{ color }} bg-opacity-10 text-{{ color }} rounded-3 p-3">
      <i class="bi fs-3" [ngClass]="icon"></i>
    </div>
  </div>
</div>
