
    <div class="container-fluid py-4">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
              <h5 class="mb-0 fw-bold">Post Inventory Transaction</h5>
              <button class="btn btn-outline-secondary btn-sm" routerLink="/inventory">Cancel</button>
            </div>
            <div class="card-body p-4">
              <form [formGroup]="transactionForm" (ngSubmit)="save()">
                <div class="mb-3">
                  <label class="form-label fw-bold">Select Material</label>
                  <select class="form-select" formControlName="itemId" (change)="onItemSelect()">
                    <option value="">Select Item...</option>
                    <option *ngFor="let item of inventory" [value]="item.id">{{ item.item }} (Current: {{ item.qtyOnHand }} {{ item.unit }})</option>
                  </select>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Transaction Type</label>
                    <select class="form-select" formControlName="type">
                      <option value="RECEIPT">Goods Receipt (GRN)</option>
                      <option value="ISSUE">Material Issue (MIN)</option>
                      <option value="ADJUSTMENT">Stock Adjustment</option>
                      <option value="RETURN">Return Processing</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Quantity</label>
                    <input type="number" class="form-control" formControlName="quantity">
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Reference No / Document #</label>
                  <input type="text" class="form-control" formControlName="referenceNo" placeholder="e.g. GRN-1002">
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold">Transaction Date</label>
                  <input type="date" class="form-control" formControlName="date">
                </div>

                <div class="mb-4">
                  <label class="form-label fw-bold">Remarks / Reason</label>
                  <textarea class="form-control" formControlName="remarks" rows="2"></textarea>
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary py-2 shadow-sm" [disabled]="transactionForm.invalid">
                    <i class="bi bi-save me-2"></i> Post Transaction
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
