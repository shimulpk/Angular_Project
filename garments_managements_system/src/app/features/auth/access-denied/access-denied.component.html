<div class="access-denied-container d-flex flex-column justify-content-center align-items-center vh-100 bg-light">
  <div class="text-center p-5 bg-white shadow rounded-4">
    <i class="bi bi-shield-lock-fill text-danger" style="font-size: 4rem;"></i>
    <h2 class="mt-3 text-dark fw-bold">Access Denied</h2>
    <p class="text-muted mb-4">You do not have permission to view this page or your assigned roles have no accessible modules yet.</p>
    
    <div class="d-flex justify-content-center gap-3">
      <button class="btn btn-primary px-4 rounded-pill" (click)="logout()">
        <i class="bi bi-box-arrow-right me-2"></i>Logout & Clear Session
      </button>
    </div>
  </div>
</div>
