
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold">Style Library</h3>
          <p class="text-muted">Repository of garment designs and tech packs</p>
        </div>
        <button class="btn btn-primary shadow-sm">
          <i class="bi bi-plus-lg me-2"></i> Create Tech Pack
        </button>
      </div>

      <div class="row">
        <div *ngFor="let style of styles" class="col-md-4 col-lg-3 mb-4">
          <div class="card h-100 border-0 shadow-sm overflow-hidden">
            <div class="bg-light d-flex align-items-center justify-content-center" style="height: 200px;">
              <i class="bi bi-image text-muted fs-1"></i>
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <span class="badge bg-info text-dark mb-2">{{ style.garmentType }}</span>
                <span class="text-muted small">{{ style.season }}</span>
              </div>
              <h5 class="fw-bold mb-1">{{ style.styleCode }}</h5>
              <p class="text-muted small mb-3">{{ style.styleName }}</p>
              <div class="d-grid">
                <button class="btn btn-outline-primary btn-sm">View Details</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
