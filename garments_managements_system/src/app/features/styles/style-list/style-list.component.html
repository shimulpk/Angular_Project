
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold">Style Library</h3>
          <p class="text-muted">Manage garment designs, seasons, and technical specifications</p>
        </div>
        <button class="btn btn-primary shadow-sm" routerLink="/styles/new">
          <i class="bi bi-plus-lg me-2"></i> Add New Style
        </button>
      </div>

      <!-- Filters -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <input type="text" class="form-control" placeholder="Search styles..." [(ngModel)]="searchTerm" (input)="filterStyles()">
            </div>
            <div class="col-md-2">
              <select class="form-select" [(ngModel)]="seasonFilter" (change)="filterStyles()">
                <option value="">All Seasons</option>
                <option value="Spring 2024">Spring 2024</option>
                <option value="Summer 2024">Summer 2024</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select" [(ngModel)]="typeFilter" (change)="filterStyles()">
                <option value="">All Types</option>
                <option value="T-Shirt">T-Shirt</option>
                <option value="Trousers">Trousers</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select" [(ngModel)]="statusFilter" (change)="filterStyles()">
                <option value="">All Status</option>
                <option value="Approved">Approved</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Style Grid -->
      <div class="row">
        <div *ngFor="let style of filteredStyles" class="col-md-4 col-lg-3 mb-4">
          <div class="card h-100 border-0 shadow-sm style-card position-relative overflow-hidden">
            <div class="status-badge" [ngClass]="getStatusClass(style.approvalStatus)">
              {{ style.approvalStatus }}
            </div>
            <div class="card-img-container bg-light d-flex align-items-center justify-content-center" style="height: 220px;">
              <img *ngIf="style.imageUrl; else noImg" [src]="style.imageUrl" class="img-fluid h-100 w-100 object-fit-cover" alt="Style Image">
              <ng-template #noImg><i class="bi bi-image text-muted fs-1"></i></ng-template>
            </div>
            <div class="card-body p-3">
              <div class="d-flex justify-content-between mb-1">
                <small class="text-primary fw-bold">{{ style.styleCode }}</small>
                <small class="text-muted">{{ style.season }}</small>
              </div>
              <h6 class="fw-bold mb-2">{{ style.styleName }}</h6>
              <div class="d-flex gap-2 mb-3">
                <span class="badge bg-light text-dark border">{{ style.garmentType }}</span>
                <span class="badge bg-light text-dark border">{{ style.gender }}</span>
              </div>
              <div class="d-grid gap-2">
                <button class="btn btn-outline-primary btn-sm" [routerLink]="['/styles', style.id]">
                  <i class="bi bi-eye me-1"></i> Details
                </button>
              </div>
            </div>
          </div>
        </div>
        <div *ngIf="filteredStyles.length === 0" class="col-12 text-center py-5 text-muted">
          <i class="bi bi-search display-4 d-block mb-3"></i>
          <h5>No styles match your search criteria.</h5>
        </div>
      </div>
    </div>
