<div class="container-fluid py-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
      <h5 class="mb-0 text-primary"><i class="bi bi-palette me-2"></i>BOM Style List (Bill of Materials)</h5>
      <button class="btn btn-sm btn-primary" routerLink="/bom-style/add">
        <i class="bi bi-plus-circle me-1"></i> Add BOM Style
      </button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="px-4">Style Code</th>
              <th>Style Type</th>
              <th>Description</th>
              <th class="text-end px-4">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let style of styles">
              <td class="px-4">
                <span class="badge bg-light text-dark border fw-semibold">{{ style.styleCode }}</span>
              </td>
              <td>
                <span class="badge" [ngClass]="{'bg-primary': style.styleType === 'Formal', 'bg-info text-dark': style.styleType === 'Casual'}">
                  {{ style.styleType || 'N/A' }}
                </span>
              </td>
              <td class="text-truncate" style="max-width: 300px;" [title]="style.description || style.styleName">
                {{ style.description || style.styleName || 'N/A' }}
              </td>
              <td class="text-end px-4">
                <a [routerLink]="['/bom-style/detail', style.styleCode]"
                   class="btn btn-sm btn-outline-primary me-1" title="View BOM Items for this Style">
                  <i class="bi bi-eye me-1"></i> View
                </a>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteStyle(style.id!)" title="Delete Style">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="styles.length === 0">
              <td colspan="4" class="text-center py-5 text-muted">
                <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
                No BOM styles found.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
