<div class="container-fluid py-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
      <h5 class="mb-0 text-primary"><i class="bi bi-cart-plus me-2"></i>Create New Order</h5>
      <button class="btn btn-sm btn-outline-primary" routerLink="/order-management/list">
        <i class="bi bi-list-ul me-1"></i> View All Orders
      </button>
    </div>
    <div class="card-body">
      <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">

        <div class="row mb-4">
          <div class="col-md-4 mb-3">
            <label class="form-label text-muted small fw-bold">Order ID *</label>
            <input type="text" class="form-control" formControlName="orderId" placeholder="e.g. ORD-2025-001">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label text-muted small fw-bold">Style Code *</label>
            <select class="form-select" formControlName="styleId">
              <option value="">Select Style...</option>
              <option *ngFor="let s of styles" [value]="s.id">{{ s.styleCode }} - {{ s.styleName }}</option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label text-muted small fw-bold">Order Status *</label>
            <select class="form-select" formControlName="status">
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label text-muted small fw-bold">Buyer Name *</label>
            <select class="form-select" formControlName="buyerId">
              <option value="">Select Buyer...</option>
              <option *ngFor="let b of buyers" [value]="b.id">{{ b.companyName }}</option>
            </select>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label text-muted small fw-bold">Order Date *</label>
            <input type="date" class="form-control" formControlName="orderDate">
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label text-muted small fw-bold">Delivery Date *</label>
            <input type="date" class="form-control" formControlName="shipDate">
          </div>
          <div class="col-md-12 mb-3">
            <label class="form-label text-muted small fw-bold">Shipping Address *</label>
            <textarea class="form-control" formControlName="shippingAddress" rows="2"></textarea>
          </div>
        </div>

        <h6 class="fw-bold mb-3 text-primary border-bottom pb-2">Order Calculation</h6>

        <div class="row">
          <!-- Short Sleeve -->
          <div class="col-md-6">
            <div class="bg-light p-3 rounded-3 mb-3">
              <h6 class="mb-3 text-dark">Short Sleeve Shirt</h6>
              <div formArrayName="shortSleeveItems">
                <div *ngFor="let item of shortSleeveItems.controls; let i=index" [formGroupName]="i" class="row gx-2 mb-2 align-items-center">
                  <div class="col-2"><span class="badge bg-secondary w-100">{{ item.get('size')?.value }}</span></div>
                  <div class="col-5">
                    <input type="number" class="form-control form-control-sm" formControlName="quantity" placeholder="Qty">
                  </div>
                  <div class="col-5">
                    <input type="number" class="form-control form-control-sm" formControlName="unitPrice" placeholder="Price">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Full Sleeve -->
          <div class="col-md-6">
            <div class="bg-light p-3 rounded-3 mb-3">
              <h6 class="mb-3 text-dark">Full Sleeve Shirt</h6>
              <div formArrayName="fullSleeveItems">
                <div *ngFor="let item of fullSleeveItems.controls; let i=index" [formGroupName]="i" class="row gx-2 mb-2 align-items-center">
                  <div class="col-2"><span class="badge bg-secondary w-100">{{ item.get('size')?.value }}</span></div>
                  <div class="col-5">
                    <input type="number" class="form-control form-control-sm" formControlName="quantity" placeholder="Qty">
                  </div>
                  <div class="col-5">
                    <input type="number" class="form-control form-control-sm" formControlName="unitPrice" placeholder="Price">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="bg-primary bg-opacity-10 p-3 rounded-3 mt-3 border border-primary border-opacity-25">
          <h6 class="fw-bold text-primary mb-3">Order Summary</h6>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Subtotal:</span>
            <span class="fw-medium">${{ orderForm.get('subtotal')?.value | number:'1.2-2' }}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-muted">VAT:</span>
            <div class="d-flex align-items-center gap-2">
              <span class="text-muted small">$</span>
              <input type="number" class="form-control form-control-sm" formControlName="vat"
                     step="0.01" style="width: 120px; text-align: right;">
            </div>
          </div>
          
          <hr class="my-2 border-primary border-opacity-25">
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold text-dark fs-5">Grand Total:</span>
            <span class="fw-bold text-primary fs-4">${{ orderForm.get('grandTotal')?.value | number:'1.2-2' }}</span>
          </div>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-primary w-100 py-2 fs-5" [disabled]="orderForm.invalid">
            <i class="bi bi-cart-check me-2"></i> Confirm Order
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
