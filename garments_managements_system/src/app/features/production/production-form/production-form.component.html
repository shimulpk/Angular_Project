
    <div class="container-fluid py-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
              <h5 class="mb-0 fw-bold">Assign Production Order</h5>
              <button class="btn btn-outline-secondary btn-sm" routerLink="/production">Cancel</button>
            </div>
            <div class="card-body p-4">
              <form [formGroup]="prodForm" (ngSubmit)="save()">
                <div class="row g-4">
                  <div class="col-md-12">
                    <label class="form-label fw-bold">Select Confirmed PO</label>
                    <select class="form-select" formControlName="orderId" (change)="onOrderSelect()">
                      <option value="">Select Order...</option>
                      <option *ngFor="let order of confirmedOrders" [value]="order.id">{{ order.poNumber }} ({{ order.totalQuantity }} Units)</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Production Line</label>
                    <select class="form-select" formControlName="lineId">
                      <option value="">Choose Line...</option>
                      <option *ngFor="let line of lines" [value]="line.id">{{ line.name }} (Cap: {{ line.capacity }}/hr)</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Start Stage</label>
                    <select class="form-select" formControlName="stage">
                      <option value="CUTTING">CUTTING</option>
                      <option value="SEWING">SEWING</option>
                      <option value="FINISHING">FINISHING</option>
                      <option value="PACKING">PACKING</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Target Quantity</label>
                    <input type="number" class="form-control" formControlName="targetQty">
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-bold">Start Date</label>
                    <input type="date" class="form-control" formControlName="startDate">
                  </div>
                </div>

                <div class="alert alert-warning mt-4 mb-0" *ngIf="prodForm.get('targetQty')?.value > 5000">
                  <i class="bi bi-exclamation-triangle me-2"></i> Large order detected. Consider multi-line assignment for better efficiency.
                </div>

                <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                  <button type="submit" class="btn btn-primary px-5 shadow-sm" [disabled]="prodForm.invalid">
                    Start Production Tracking
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
