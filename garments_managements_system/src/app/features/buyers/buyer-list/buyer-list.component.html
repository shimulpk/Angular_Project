
    <div class="modal-backdrop fade show"></div>
    <div class="modal fade show" style="display: block;">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title fw-bold">{{ buyer ? 'Edit Buyer' : 'Add New Buyer' }}</h5>
            <button type="button" class="btn-close btn-close-white" (click)="onClose.emit()"></button>
          </div>
          <div class="modal-body p-4">
            <form [formGroup]="buyerForm" (ngSubmit)="save()">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Buyer Code</label>
                  <input type="text" class="form-control" formControlName="buyerCode" placeholder="e.g. HM001">
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Company Name</label>
                  <input type="text" class="form-control" formControlName="companyName" placeholder="e.g. H&M Group">
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Country</label>
                  <input type="text" class="form-control" formControlName="country">
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Currency</label>
                  <select class="form-select" formControlName="currency">
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-bold">Status</label>
                  <select class="form-select" formControlName="status">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label fw-bold">Payment Terms</label>
                  <input type="text" class="form-control" formControlName="paymentTerms" placeholder="e.g. Net 60 days">
                </div>
              </div>

              <hr class="my-4">

              <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="mb-0 fw-bold"><i class="bi bi-people me-2"></i>Contact Persons</h6>
                <button type="button" class="btn btn-sm btn-outline-primary" (click)="addContact()">
                  <i class="bi bi-plus"></i> Add Contact
                </button>
              </div>

              <div formArrayName="contacts">
                <div *ngFor="let contact of contacts.controls; let i=index" [formGroupName]="i" class="card bg-light border-0 mb-3">
                  <div class="card-body p-3">
                    <div class="row g-2">
                      <div class="col-md-4">
                        <input type="text" class="form-control form-control-sm" formControlName="name" placeholder="Name">
                      </div>
                      <div class="col-md-4">
                        <input type="email" class="form-control form-control-sm" formControlName="email" placeholder="Email">
                      </div>
                      <div class="col-md-3">
                        <input type="text" class="form-control form-control-sm" formControlName="phone" placeholder="Phone">
                      </div>
                      <div class="col-md-1">
                        <button type="button" class="btn btn-sm btn-outline-danger w-100" (click)="removeContact(i)">
                          <i class="bi bi-x"></i>
                        </button>
                      </div>
                      <div class="col-12 mt-2">
                        <input type="text" class="form-control form-control-sm" formControlName="designation" placeholder="Designation">
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="button" class="btn btn-light" (click)="onClose.emit()">Cancel</button>
                <button type="submit" class="btn btn-primary px-4" [disabled]="buyerForm.invalid">
                  {{ buyer ? 'Update Buyer' : 'Save Buyer' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
