<div class="container-fluid py-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
      <h5 class="mb-0 text-primary"><i class="bi bi-plus-circle me-2"></i>Add Unit of Measurement (UOM)</h5>
      <button class="btn btn-sm btn-outline-primary" routerLink="/uom-management/list">
        <i class="bi bi-list-ul me-1"></i> View UOM List
      </button>
    </div>
    <div class="card-body">
      <form [formGroup]="uomForm" (ngSubmit)="onSubmit()">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label text-muted small fw-bold">Product Name *</label>
            <input type="text" class="form-control" formControlName="productName" placeholder="e.g. Short Sleeve Shirt">
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small fw-bold">Size *</label>
            <select class="form-select" formControlName="size">
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
            </select>
          </div>
          
          <div class="col-md-4">
            <label class="form-label text-muted small fw-bold">Body</label>
            <input type="number" class="form-control" formControlName="body" step="0.01">
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small fw-bold">Sleeve </label>
            <input type="number" class="form-control" formControlName="sleeve" step="0.01">
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small fw-bold">Pocket</label>
            <input type="number" class="form-control" formControlName="pocket" step="0.01">
          </div>

          <div class="col-md-6">
            <label class="form-label text-muted small fw-bold">Wastage %</label>
            <input type="number" class="form-control" formControlName="wastage" step="0.1">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small fw-bold">Shrinkage %</label>
            <input type="number" class="form-control" formControlName="shrinkage" step="0.1">
          </div>

          <div class="col-md-12 mt-4">
            <div class="p-3 bg-primary bg-opacity-10 rounded-3 border border-primary border-opacity-25 d-flex justify-content-between align-items-center flex-wrap gap-3">
              <div>
                <label class="form-label text-primary fw-bold mb-1">Total Base Fabric </label>
                <div class="fs-4 fw-bold text-dark">{{ uomForm.get('totalBaseFabric')?.value }}</div>
                <div class="x-small text-muted">Formula: Body + Sleeve + Pocket + (Body × Wastage%) + (Body × Shrinkage%)</div>
              </div>
              <button type="submit" class="btn btn-primary btn-lg px-5" [disabled]="uomForm.invalid">
                <i class="bi bi-save me-2"></i> Save UOM
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
