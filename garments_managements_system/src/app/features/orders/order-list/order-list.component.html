
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold">Order Management</h3>
          <p class="text-muted">Track and manage global purchase orders (PO)</p>
        </div>
        <button class="btn btn-primary shadow-sm" routerLink="/orders/new">
          <i class="bi bi-magic me-2"></i> Create PO Wizard
        </button>
      </div>

      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <input type="text" class="form-control" placeholder="Search PO Number..." [(ngModel)]="searchTerm" (input)="filterOrders()">
            </div>
            <div class="col-md-3">
              <select class="form-select" [(ngModel)]="statusFilter" (change)="filterOrders()">
                <option value="">All Status</option>
                <option value="DRAFT">Draft</option>
                <option value="CONFIRMED">Confirmed</option>
                <option value="IN_PRODUCTION">In Production</option>
                <option value="SHIPPED">Shipped</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm">
        <app-reusable-table
          [columns]="columns"
          [data]="filteredOrders"
          (onView)="viewOrder($event)"
          (onEdit)="editOrder($event)"
          (onDelete)="deleteOrder($event)">
        </app-reusable-table>
      </div>
    </div>
