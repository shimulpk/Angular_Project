
    <div class="container-fluid py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold">BOM Builder</h3>
          <p class="text-muted">Create Bill of Materials and calculate material consumption</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" (click)="resetForm()">Reset</button>
          <button class="btn btn-primary px-4 shadow-sm" (click)="saveBOM()" [disabled]="bomForm.invalid">
            <i class="bi bi-check-lg me-2"></i> Finalize BOM
          </button>
        </div>
      </div>

      <form [formGroup]="bomForm">
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <div class="row g-4">
              <div class="col-md-4">
                <label class="form-label fw-bold">Select Style</label>
                <select class="form-select" formControlName="styleId">
                  <option value="">Choose Style...</option>
                  <option *ngFor="let style of styles" [value]="style.id">{{ style.styleCode }} - {{ style.styleName }}</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold">Version</label>
                <input type="text" class="form-control" formControlName="version" placeholder="e.g. V1.0">
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold">Status</label>
                <select class="form-select" formControlName="status">
                  <option value="Draft">Draft</option>
                  <option value="Final">Final</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm overflow-hidden">
          <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">Material List</h5>
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="addMaterial()">
              <i class="bi bi-plus-lg me-1"></i> Add Material
            </button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead class="bg-light">
                  <tr>
                    <th width="20%">Material Name</th>
                    <th width="15%">Category</th>
                    <th width="10%">Unit</th>
                    <th width="10%">Consump.</th>
                    <th width="10%">Wastage %</th>
                    <th width="15%">Supplier</th>
                    <th width="15%" class="text-end">Total Req.</th>
                    <th width="50"></th>
                  </tr>
                </thead>
                <tbody formArrayName="items">
                  <tr *ngFor="let item of items.controls; let i=index" [formGroupName]="i">
                    <td><input type="text" class="form-control form-control-sm" formControlName="materialName" placeholder="e.g. Cotton Fabric"></td>
                    <td>
                      <select class="form-select form-select-sm" formControlName="category">
                        <option value="Fabric">Fabric</option>
                        <option value="Trims">Trims</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Packaging">Packaging</option>
                      </select>
                    </td>
                    <td>
                      <select class="form-select form-select-sm" formControlName="unit">
                        <option value="Kg">Kg</option>
                        <option value="Yards">Yards</option>
                        <option value="Meters">Meters</option>
                        <option value="Cone">Cone</option>
                        <option value="Pcs">Pcs</option>
                        <option value="Gross">Gross</option>
                      </select>
                    </td>
                    <td><input type="number" class="form-control form-control-sm" formControlName="consumption" (input)="calculateItemTotal(i)"></td>
                    <td><input type="number" class="form-control form-control-sm" formControlName="wastagePercent" (input)="calculateItemTotal(i)"></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="supplier" placeholder="Supplier name"></td>
                    <td class="text-end fw-bold">{{ item.get('totalRequirement')?.value | number:'1.4-4' }}</td>
                    <td>
                      <button type="button" class="btn btn-link text-danger p-0" (click)="removeMaterial(i)">
                        <i class="bi bi-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </form>

      <!-- Fabric Calculator Mock -->
      <div class="row mt-4">
        <div class="col-md-6">
          <div class="card border-0 bg-info bg-opacity-10 shadow-sm">
            <div class="card-body">
              <h6 class="fw-bold mb-3"><i class="bi bi-calculator me-2"></i>Fabric Weight Calculator (Grams/Meter)</h6>
              <div class="row g-2">
                <div class="col">
                  <small class="text-muted d-block">GSM</small>
                  <input type="number" class="form-control form-control-sm" placeholder="e.g. 180">
                </div>
                <div class="col">
                  <small class="text-muted d-block">Width (Inches)</small>
                  <input type="number" class="form-control form-control-sm" placeholder="e.g. 60">
                </div>
                <div class="col-auto d-flex align-items-end">
                  <button class="btn btn-sm btn-info text-white">Calc</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
