<div class="container-fluid py-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
      <h5 class="mb-0 text-primary"><i class="bi bi-file-earmark-plus me-2"></i>Add BOM View (Bill of Current Items)</h5>
      <button class="btn btn-sm btn-outline-primary" routerLink="/bom-style/list">
        <i class="bi bi-palette me-1"></i> Back to Style List
      </button>
    </div>
    <div class="card-body">
      <form [formGroup]="bomForm" (ngSubmit)="onSubmit()">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label text-muted small fw-bold">Serial *</label>
            <input type="number" class="form-control" formControlName="serial">
          </div>
          <div class="col-md-9">
            <label class="form-label text-muted small fw-bold">Style Code *</label>
            <select class="form-select" formControlName="styleCode">
              <option value="">Select Style...</option>
              <option *ngFor="let s of styles" [value]="s.styleCode">{{ s.styleCode }} ({{ s.styleName }})</option>
            </select>
          </div>

          <div class="col-md-12">
            <label class="form-label text-muted small fw-bold">Base Fabric *</label>
            <select class="form-select" formControlName="baseFabric">
              <option value="">Select Base Fabric (from UOM)...</option>
              <option *ngFor="let u of uoms" [value]="u.productName">
                <!-- {{ u.productName }} ({{ u.size }} - {{ u.totalBaseFabric }}m) -->
                  {{ u.totalBaseFabric }}
              </option>
            </select>
          </div>

          <div class="col-md-8">
            <label class="form-label text-muted small fw-bold">Material *</label>
            <input type="text" class="form-control" formControlName="materialName" placeholder="e.g. Cotton">
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small fw-bold">Unit *</label>
            <input type="text" class="form-control" formControlName="unit" placeholder="e.g. Kg, M">
          </div>

          <div class="col-md-6">
            <label class="form-label text-muted small fw-bold">Quantity *</label>
            <input type="number" class="form-control" formControlName="quantity" step="0.01">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small fw-bold">Unit Price *</label>
            <input type="number" class="form-control" formControlName="unitPrice" step="0.01">
          </div>

          <div class="col-md-12">
            <div class="p-3 bg-success bg-opacity-10 rounded-3 border border-success border-opacity-25 d-flex justify-content-between align-items-center flex-wrap gap-3">
              <div>
                <label class="form-label text-success fw-bold mb-1">Total Cost</label>
                <div class="fs-4 fw-bold text-dark">${{ bomForm.get('totalCost')?.value | number:'1.2-2' }}</div>
                <div class="x-small text-muted">Quantity × Unit Price</div>
              </div>
              <button type="submit" class="btn btn-primary btn-lg px-5" [disabled]="bomForm.invalid">
                <i class="bi bi-save me-2"></i> Save BOM Item
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
