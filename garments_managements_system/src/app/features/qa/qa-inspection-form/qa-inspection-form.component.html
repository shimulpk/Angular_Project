
    <div class="container-fluid py-4">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
              <h5 class="mb-0 fw-bold">Log Quality Inspection</h5>
              <button class="btn btn-outline-secondary btn-sm" routerLink="/qa">Cancel</button>
            </div>
            <div class="card-body p-4">
              <form [formGroup]="qaForm" (ngSubmit)="save()">
                <div class="row g-3">
                  <div class="col-md-4">
                    <label class="form-label fw-bold">PO Number</label>
                    <select class="form-select" formControlName="orderId" (change)="onOrderSelect()">
                      <option value="">Select Order...</option>
                      <option *ngFor="let order of orders" [value]="order.id">{{ order.poNumber }}</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-bold">Line</label>
                    <select class="form-select" formControlName="lineId">
                      <option value="">Select Line...</option>
                      <option *ngFor="let line of lines" [value]="line.id">{{ line.name }}</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-bold">Inspection Type</label>
                    <select class="form-select" formControlName="inspectionType">
                      <option value="Inline">Inline</option>
                      <option value="Final">Final</option>
                    </select>
                  </div>

                  <div class="col-md-3">
                    <label class="form-label fw-bold">Total Check Qty</label>
                    <input type="number" class="form-control" formControlName="checkQty" (input)="calculateMetrics()">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label fw-bold">Pass Qty</label>
                    <input type="number" class="form-control border-success" formControlName="passQty" (input)="calculateMetrics()">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label fw-bold text-danger">Fail Qty</label>
                    <input type="number" class="form-control border-danger" formControlName="failQty" (input)="calculateMetrics()">
                  </div>
                  <div class="col-md-3">
                    <label class="form-label fw-bold">Calculated DHU</label>
                    <input type="number" class="form-control bg-light" formControlName="dhu" readonly>
                  </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h6 class="fw-bold mb-0">Defect Classification</h6>
                  <button type="button" class="btn btn-sm btn-outline-danger" (click)="addDefect()">
                    <i class="bi bi-plus"></i> Add Defect
                  </button>
                </div>

                <div formArrayName="defects">
                  <div *ngFor="let defect of defects.controls; let i=index" [formGroupName]="i" class="row g-2 mb-2 align-items-center">
                    <div class="col-md-7">
                      <select class="form-select form-select-sm" formControlName="type">
                        <option value="Broken Stitch">Broken Stitch</option>
                        <option value="Oil Stain">Oil Stain</option>
                        <option value="Shade Variation">Shade Variation</option>
                        <option value="Measurement">Measurement</option>
                        <option value="Raw Edge">Raw Edge</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <input type="number" class="form-control form-control-sm" formControlName="count" placeholder="Count" (input)="calculateMetrics()">
                    </div>
                    <div class="col-md-1">
                      <button type="button" class="btn btn-sm btn-link text-danger p-0" (click)="removeDefect(i)">
                        <i class="bi bi-x-circle"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="row g-3 mt-4 pt-3 border-top">
                  <div class="col-md-6">
                    <label class="form-label fw-bold">Inspector Name</label>
                    <input type="text" class="form-control" formControlName="inspector">
                  </div>
                  <div class="col-md-6 d-flex align-items-end justify-content-end">
                    <button type="submit" class="btn btn-success px-5 shadow-sm" [disabled]="qaForm.invalid">
                      Submit Inspection Report
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
